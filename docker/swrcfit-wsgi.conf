# The WSGI adapter captures legacy print-based output, so use one thread.
WSGIDaemonProcess swrcfit processes=1 threads=1 python-home=/usr/local python-path=/var/www/html

<Directory /var/www/html>
    WSGIProcessGroup swrcfit
    # NumPy/SciPy/Matplotlib are safest in the main Python interpreter.
    WSGIApplicationGroup %{GLOBAL}
    Require all granted
</Directory>
